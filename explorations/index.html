<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenTutor — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Lilita One loads from Google. Nougat / Acropolis Black / Some Time Later are not webfonts:
     drop their files into ./fonts/ (see fonts/README.txt) and they pick up via @font-face below. -->
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- KaTeX for real math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
/* ---- custom fonts: drop files in ./fonts/ ; local() lets installed copies work too ---- */
@font-face{font-family:'Nougat';src:local('Nougat'),url('fonts/Nougat.woff2') format('woff2'),url('fonts/Nougat.otf') format('opentype'),url('fonts/Nougat.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Acropolis Black';src:local('Acropolis Black'),local('Acropolis-Black'),url('fonts/AcropolisBlack.woff2') format('woff2'),url('fonts/AcropolisBlack.otf') format('opentype');font-display:swap}
@font-face{font-family:'Some Time Later';src:local('Some Time Later'),url('fonts/SomeTimeLater.woff2') format('woff2'),url('fonts/SomeTimeLater.otf') format('opentype'),url('fonts/SomeTimeLater.ttf') format('truetype');font-display:swap}
:root{
  --gold:#FEC513; --gold-d:#DD7504; --red:#FB1A24; --red-d:#9F0113;
  --blue:#0084D8; --cyan:#18ABEF; --cyan-l:#7EDCFD; --ink:#151319;
  --paper:#fff; --violet:#3b2a86; --violet-d:#241a52; --violet-dd:#160f38;
  --green:#3fd971; --green-d:#1f9e46; --purple:#8a4bff;
  --panel:#2c2065; --panel-l:#3a2c82;
  --out:4px solid var(--ink);
  --shadow:0 8px 0 rgba(0,0,0,.35);
  /* font stacks — custom faces first, legible fallbacks after */
  --f-display:'Acropolis Black','Lilita One',sans-serif;   /* hero / big XP numbers */
  --f-head:'Lilita One','Nougat',sans-serif;               /* headings & buttons */
  --f-ui:'Nougat','Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif; /* body & labels */
  --f-hand:'Some Time Later','Comic Sans MS','Segoe Print',cursive;      /* handwriting */
  /* shared frame height so both devices fill the viewport */
  --screen-h:clamp(520px, 74vh, 1000px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-ui);
  background:
    radial-gradient(1200px 600px at 20% -10%, #4a2fae 0%, transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, #7a2fae 0%, transparent 55%),
    linear-gradient(180deg,#241a52 0%, #160f38 100%);
  background-attachment:fixed;
  color:#fff; min-height:100vh; overflow-x:hidden;
}
.display{font-family:var(--f-head);letter-spacing:.5px}
.up{text-transform:uppercase}

/* ===== top app bar ===== */
.appbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:16px;
  padding:12px 22px;
  background:linear-gradient(180deg,#2a1d63,#1c1447);
  border-bottom:4px solid var(--ink);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.brand .name{font-family:var(--f-head);font-size:26px;line-height:1}
.brand .name b{color:var(--gold)}
.brand .tag{font-size:11px;color:#b9a6ff;letter-spacing:2px;text-transform:uppercase;margin-top:2px}

.spacer{flex:1}
.hint{font-size:12px;color:#c9bcff;text-align:right;line-height:1.4}
.hint b{color:var(--gold)}

/* ===== stage stepper ===== */
.stepper{
  display:flex;gap:8px;align-items:center;overflow-x:auto;
  padding:12px 22px;background:rgba(0,0,0,.18);
  border-bottom:3px solid rgba(0,0,0,.35);
}
.stepper::-webkit-scrollbar{height:6px}
.stepper::-webkit-scrollbar-thumb{background:var(--gold);border-radius:6px}
.step{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:8px 14px;border-radius:14px;border:3px solid rgba(0,0,0,.4);
  background:rgba(255,255,255,.06);color:#cfc3ff;font-weight:600;font-size:13px;
  transition:.15s;white-space:nowrap;
}
.step .num{
  width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.15);font-family:var(--f-head);font-size:12px;
}
.step:hover{transform:translateY(-2px)}
.step.active{
  background:linear-gradient(180deg,var(--gold),var(--gold-d));
  color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.4);
}
.step.active .num{background:rgba(0,0,0,.25);color:#fff}
.step.done{color:#fff;border-color:rgba(63,217,113,.6)}
.step.done .num{background:var(--green);color:var(--ink)}

/* ===== nav controls ===== */
.nav{display:flex;gap:10px;padding:16px 22px 6px;align-items:center}
.btn{
  font-family:var(--f-head);letter-spacing:.5px;text-transform:uppercase;
  border:var(--out);border-radius:16px;cursor:pointer;color:#fff;
  padding:12px 22px;font-size:15px;position:relative;top:0;
  box-shadow:0 6px 0 rgba(0,0,0,.4);transition:.08s;user-select:none;
}
.btn:active{top:5px;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.gold{background:linear-gradient(180deg,#ffd83f,var(--gold-d));color:var(--ink)}
.btn.blue{background:linear-gradient(180deg,var(--cyan),var(--blue))}
.btn.red{background:linear-gradient(180deg,#ff4b52,var(--red-d))}
.btn.green{background:linear-gradient(180deg,#5cf08c,var(--green-d))}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:12px;border-width:3px;box-shadow:0 4px 0 rgba(0,0,0,.4)}

/* ===== stage layout: two frames ===== */
.stage-title{padding:6px 24px 0}
.stage-title h2{font-family:var(--f-head);font-size:22px;color:var(--gold)}
.stage-title p{font-size:13px;color:#ccbfff;max-width:900px;margin-top:2px}

.frames{
  display:flex;gap:24px;justify-content:center;align-items:flex-start;
  padding:14px 20px 50px;flex-wrap:nowrap;
}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.device-wrap.desk{flex:1 1 auto;min-width:0;max-width:1500px}
.device-wrap.mob{flex:0 0 auto}
.device-label{
  font-family:var(--f-head);font-size:13px;letter-spacing:1px;text-transform:uppercase;
  color:#fff;background:rgba(0,0,0,.3);padding:5px 14px;border-radius:20px;border:3px solid rgba(0,0,0,.4);
}
.device-label.primary{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:var(--ink);border-color:var(--ink)}

/* desktop chrome */
.desktop{
  width:100%;
}
.desktop .bezel{
  background:#0e0a26;border:6px solid var(--ink);border-radius:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.5);overflow:hidden;
}
.desktop .titlebar{
  height:30px;background:#1c1540;display:flex;align-items:center;gap:7px;padding:0 12px;
  border-bottom:3px solid rgba(0,0,0,.4);
}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.desktop .screen{height:var(--screen-h);overflow:auto;background:linear-gradient(180deg,#2a1d63,#1a1244)}

/* phone chrome */
.phone{width:auto}
.phone .bezel{
  background:var(--ink);border-radius:44px;padding:12px;
  box-shadow:0 18px 40px rgba(0,0,0,.55);border:3px solid #000;
}
.phone .notch{height:22px;display:flex;justify-content:center}
.phone .notch::after{content:"";width:120px;height:22px;background:#000;border-radius:0 0 16px 16px}
.phone .screen{
  height:var(--screen-h);aspect-ratio:390/844;width:auto;max-width:34vw;overflow:auto;border-radius:32px;
  background:linear-gradient(180deg,#2a1d63,#160f38);position:relative;
}
/* stack on narrow screens */
@media(max-width:1000px){
  .frames{flex-wrap:wrap}
  .device-wrap.desk{flex:1 1 100%}
  .phone .screen{max-width:90vw}
}
.screen::-webkit-scrollbar{width:6px}
.screen::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px}

/* ===== event-lobby homepage (Brawl "Choose Event" style) ===== */
.ev-screen{
  min-height:100%;display:flex;flex-direction:column;
  background:
    radial-gradient(60px 60px at 12% 22%, rgba(255,255,255,.05) 40%, transparent 42%),
    radial-gradient(60px 60px at 78% 12%, rgba(255,255,255,.05) 40%, transparent 42%),
    radial-gradient(60px 60px at 40% 70%, rgba(255,255,255,.05) 40%, transparent 42%),
    radial-gradient(60px 60px at 90% 60%, rgba(255,255,255,.05) 40%, transparent 42%),
    linear-gradient(180deg,#2f84e8 0%, #1f66c9 100%);
  color:#fff;
}
.ev-top{
  display:flex;align-items:center;gap:14px;padding:11px 18px;
  background:#131a2e;border-bottom:4px solid #0a0f1e;
}
.ev-title{font-family:var(--f-head);font-size:26px;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.ev-iconbtn{
  width:48px;height:40px;display:grid;place-items:center;font-size:19px;color:#17213a;cursor:pointer;
  background:linear-gradient(180deg,#fff,#dfe6f5);border:3px solid #0a0f1e;border-radius:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.45);transition:.08s;
  clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);
}
.ev-iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.ev-body{flex:1;display:flex;gap:16px;padding:16px 18px}
.ev-left{flex:0 0 clamp(180px,20%,230px);display:flex;flex-direction:column;gap:10px}
.ev-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ev-h{font-family:var(--f-head);font-size:14px;letter-spacing:1.5px;color:#dbe8ff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.ev-rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* featured left card */
.ev-feat{background:#141c33;border:4px solid #0a0f1e;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.45)}
.ev-feat .cover{position:relative;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(circle at 50% 30%, #ffd23f 0%, #ff8a1e 55%, #c85a00 100%)}
.ev-feat .bookart{font-size:54px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.ev-feat .covname{font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.ev-feat .covsub{font-size:11px;color:rgba(255,255,255,.9)}
.ev-feat .fbody{padding:12px}
.ev-feat .ftime{font-family:var(--f-head);font-size:18px;color:#ffd23f;margin:2px 0 8px}
.badge-i{position:absolute;top:8px;right:8px}
.ev-i{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:linear-gradient(180deg,#4fb0ff,#1c7fe0);
  border:2px solid #0a0f1e;color:#fff;font-family:var(--f-head);font-size:12px;display:grid;place-items:center;cursor:pointer}
.ev-mini-bar{height:12px;border-radius:8px;background:rgba(0,0,0,.35);border:2px solid #0a0f1e;overflow:hidden}
.ev-mini-bar>i{display:block;height:100%;background:linear-gradient(90deg,#18ABEF,#7EDCFD)}
.ev-btn{width:100%;font-family:var(--f-head);letter-spacing:.5px;color:#fff;border:3px solid #0a0f1e;border-radius:12px;
  padding:10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.45);margin-top:10px;font-size:14px;transition:.08s}
.ev-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.ev-btn.play{background:linear-gradient(180deg,#5cf08c,#1f9e46)}
.ev-btn.up{background:linear-gradient(180deg,#ffd83f,#dd7504);color:#3a2400;margin-top:0}

/* streak badge */
.ev-streak{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:13px;color:#3a2400;
  background:linear-gradient(180deg,#ffe066,#e08a00);border:3px solid #0a0f1e;border-radius:22px;padding:4px 14px 4px 4px;
  box-shadow:0 4px 0 rgba(0,0,0,.4)}
.ev-streak .cnt{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#ff5b52,#b3160c);color:#fff;
  display:grid;place-items:center;border:2px solid #0a0f1e;font-size:14px}

/* course card grid */
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1150px){.ev-grid{grid-template-columns:repeat(2,1fr)}}
.ev-card{background:#141c33;border:4px solid #0a0f1e;border-radius:16px;overflow:hidden;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.45);transition:.12s}
.ev-card:hover{transform:translateY(-3px)}
.ev-card .strip{display:flex;align-items:center;gap:8px;background:#1d2848;padding:6px 9px;font-size:11px;color:#9fb0d6}
.ev-card .strip .ck{color:#5cf08c;font-weight:700}
.ev-card .band{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:3px solid #0a0f1e}
.ev-card .band .mi{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:rgba(0,0,0,.28);
  display:grid;place-items:center;font-size:19px;border:2px solid rgba(0,0,0,.4)}
.ev-card .band h5{font-family:var(--f-head);font-size:16px;color:#fff;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-card .band .sub{font-size:11px;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-card .prev{padding:11px}
.ev-card .dots{display:flex;gap:5px;margin-top:9px}
.ev-card .dots span{flex:1;height:10px;border-radius:3px;background:rgba(255,255,255,.14);border:1px solid rgba(0,0,0,.4)}

/* bottom tabs */
.ev-tabs{display:flex;background:#131a2e;border-top:4px solid #0a0f1e}
.ev-tab{flex:1;text-align:center;padding:13px 8px;font-family:var(--f-head);font-size:14px;letter-spacing:1.5px;
  color:#7f92bd;cursor:pointer;position:relative;transition:.1s}
.ev-tab:hover{color:#cdd9f2}
.ev-tab.active{color:#ffd23f}
.ev-tab.active::after{content:"";position:absolute;left:22%;right:22%;bottom:6px;height:4px;border-radius:3px;background:#ffd23f}

/* ===== reusable UI ===== */
.pad{padding:16px}
.pad-lg{padding:22px}
.card{
  background:linear-gradient(180deg,#3a2c82,#2c2065);
  border:4px solid var(--ink);border-radius:18px;padding:16px;
  box-shadow:0 6px 0 rgba(0,0,0,.35);
}
.card.light{background:linear-gradient(180deg,#fff,#f0ecff);color:var(--ink)}
.row{display:flex;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.center{display:grid;place-items:center;text-align:center}
.muted{color:#cbbdff}.small{font-size:12px}.tiny{font-size:11px}
h3.sec{font-family:var(--f-head);font-size:17px;margin-bottom:8px;color:#fff}
h4.sec{font-family:var(--f-head);font-size:14px;color:var(--gold);margin-bottom:6px}

.pill{
  display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;
  background:rgba(255,255,255,.12);padding:5px 12px;border-radius:20px;border:2px solid rgba(0,0,0,.35);
}
.pill.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:var(--ink);border-color:var(--ink)}
.pill.green{background:var(--green);color:var(--ink);border-color:var(--ink)}
.pill.red{background:var(--red);border-color:var(--ink)}
.pill.cyan{background:var(--cyan);color:var(--ink);border-color:var(--ink)}

/* upload dropzone */
.drop{
  border:4px dashed var(--cyan);border-radius:20px;padding:26px;text-align:center;
  background:rgba(24,171,239,.08);cursor:pointer;transition:.15s;
}
.drop:hover{background:rgba(24,171,239,.16);transform:translateY(-2px)}
.drop .ic{font-size:44px}
.book{
  border:4px solid var(--ink);border-radius:14px;padding:12px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#eee);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);
  transition:.12s;position:relative;overflow:hidden;
}
.book:hover{transform:translateY(-3px)}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:10px}
.book h5{font-family:var(--f-head);font-size:14px;margin-bottom:2px}

/* progress bars */
.bar{height:16px;border-radius:12px;background:rgba(0,0,0,.35);overflow:hidden;border:3px solid var(--ink)}
.bar > i{display:block;height:100%;background:linear-gradient(180deg,#ffe066,var(--gold-d));width:0;transition:width .8s cubic-bezier(.2,.9,.2,1)}
.bar.xp > i{background:linear-gradient(90deg,var(--cyan),#6ee7ff)}
.bar.big{height:26px}

/* processing steps */
.pstep{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:3px solid rgba(0,0,0,.3)}
.pstep .tick{width:30px;height:30px;border-radius:10px;flex:0 0 30px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:16px}
.pstep.done .tick{background:var(--green);color:var(--ink)}
.pstep.run .tick{background:var(--gold);color:var(--ink);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pstep.wait{opacity:.5}

/* knowledge graph svg */
.graph-wrap{position:relative;background:rgba(0,0,0,.22);border:4px solid var(--ink);border-radius:16px;overflow:hidden}
.gnode{cursor:pointer;transition:.12s}
.gnode:hover{filter:brightness(1.15)}
.gnode.sel rect{stroke:var(--gold);stroke-width:5}
.gnode text{font-family:var(--f-ui);font-weight:600;fill:var(--ink)}
.edge{stroke:rgba(255,255,255,.35);stroke-width:3;fill:none;marker-end:url(#arw)}
.edge.hi{stroke:var(--gold);stroke-width:4}

.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.inspector{background:rgba(0,0,0,.25);border:3px solid rgba(0,0,0,.4);border-radius:14px;padding:12px}
.field{width:100%;padding:9px 12px;border-radius:10px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-family:var(--f-ui);font-weight:600;font-size:13px}
.ai-box{background:linear-gradient(180deg,rgba(138,75,255,.25),rgba(138,75,255,.1));border:3px solid var(--purple);border-radius:14px;padding:12px}

/* battlepass */
.season{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(120deg,#6a2fae,#b3358f);border:4px solid var(--ink);
  border-radius:18px;padding:14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.35);
}
.track{display:flex;gap:14px;overflow-x:auto;padding:12px 4px 18px}
.track::-webkit-scrollbar{height:8px}
.track::-webkit-scrollbar-thumb{background:var(--gold);border-radius:8px}
.tier{flex:0 0 auto;width:118px;text-align:center}
.tier .lvl{font-family:var(--f-head);font-size:13px;color:#cbbdff;margin-bottom:4px}
.reward{
  height:118px;border-radius:16px;border:4px solid var(--ink);display:grid;place-items:center;
  font-size:44px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.35);
  background:linear-gradient(180deg,#3a2c82,#241a52);
}
.reward.unlocked{background:linear-gradient(180deg,#ffe066,var(--gold-d))}
.reward.locked{filter:grayscale(.6) brightness(.7)}
.reward .lock{position:absolute;bottom:6px;right:6px;font-size:16px}
.reward.current{outline:5px solid var(--gold);outline-offset:3px;animation:glow 1.4s infinite}
@keyframes glow{0%,100%{outline-color:var(--gold)}50%{outline-color:#fff}}
.badge{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:30px;border:4px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35)}

/* assignment map */
.map{position:relative;padding:8px}
.assign{
  display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;margin-bottom:12px;
  border:4px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);cursor:pointer;transition:.12s;
}
.assign:hover{transform:translateY(-2px)}
.assign.review{background:linear-gradient(180deg,#3aa0ff,#0064c8)}
.assign.assess{background:linear-gradient(180deg,#ff5b61,#9f0113)}
.assign.locked{filter:grayscale(.5) brightness(.7);cursor:not-allowed}
.assign .ic{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:rgba(0,0,0,.25);display:grid;place-items:center;font-size:24px}

/* quiz */
.qcard{background:linear-gradient(180deg,#fff,#f2eeff);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.qnum{font-family:var(--f-head);font-size:13px;color:var(--blue)}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:3px solid var(--ink);
  background:#fff;color:var(--ink);font-family:var(--f-ui);font-weight:600;cursor:pointer;margin-top:8px;transition:.1s;
}
.opt:hover{background:#f0ecff}
.opt.correct{background:var(--green);color:var(--ink)}
.opt.wrong{background:var(--red);color:#fff}
.opt.sel{outline:4px solid var(--gold);outline-offset:1px}
.explain{margin-top:12px;background:rgba(24,171,239,.12);border:3px solid var(--cyan);border-radius:12px;padding:12px;color:var(--ink);background:#eaf7ff}
.timer{font-family:var(--f-head);font-size:18px;background:var(--red);color:#fff;padding:5px 14px;border-radius:12px;border:3px solid var(--ink)}
.timer.calm{background:var(--green);color:var(--ink)}

.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtile{
  aspect-ratio:1;border-radius:14px;border:4px solid var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:var(--f-head);
  background:linear-gradient(180deg,#fff,#eee);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:.12s;
}
.qtile:hover{transform:translateY(-3px)}
.qtile.answered{background:linear-gradient(180deg,#5cf08c,var(--green-d));color:var(--ink)}
.qtile.flagged{outline:4px solid var(--gold)}
.qtile .qn{font-size:26px}

/* camera / crop */
.camera{
  position:relative;background:#111;border-radius:16px;overflow:hidden;border:4px solid var(--ink);
  aspect-ratio:3/4;
}
.viewfind{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg, #fbfaf5 0 30px, #ece7d8 30px 32px);}
.hw{position:absolute;color:#1a237e;font-family:var(--f-hand);transform:rotate(-3deg)}
.crop{
  position:absolute;border:3px dashed var(--gold);background:rgba(254,197,19,.12);
  box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;
}
.crop .h{position:absolute;width:16px;height:16px;background:var(--gold);border:2px solid var(--ink);border-radius:4px}
.crop .h.tl{left:-9px;top:-9px}.crop .h.tr{right:-9px;top:-9px}
.crop .h.bl{left:-9px;bottom:-9px}.crop .h.br{right:-9px;bottom:-9px}
.shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid var(--gold);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.4);margin:0 auto}
.shutter:active{transform:translateY(3px)}

/* xp reward */
.burst{
  text-align:center;padding:20px;position:relative;
}
.xp-num{font-family:var(--f-display);font-size:52px;color:var(--gold);text-shadow:0 4px 0 var(--gold-d),0 6px 8px rgba(0,0,0,.4)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(620px) rotate(540deg)}}
.levelup{font-family:var(--f-head);font-size:20px;color:#fff;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fadeup{animation:fadeup .4s both}
.dstat{background:rgba(0,0,0,.25);border:3px solid rgba(0,0,0,.4);border-radius:12px;padding:10px;text-align:center}
.dstat b{font-family:var(--f-head);font-size:20px;color:var(--gold);display:block}

.mobile-only-note{
  border:3px dashed var(--gold);border-radius:14px;padding:14px;text-align:center;color:#ffe9a8;
  background:rgba(254,197,19,.08);
}
.footer{padding:26px;text-align:center;color:#8f7fd6;font-size:12px}
</style>

function confetti(host,n=40){
  const cols=['#FEC513','#FB1A24','#18ABEF','#3fd971','#8a4bff','#fff'];
  let h='<div class="confetti">';
  for(let i=0;i<n;i++){const l=Math.floor((i/n)*100);const d=(1.4+((i%7)*0.28)).toFixed(2);const de=((i%9)*0.15).toFixed(2);

  h+='</div>'; host.insertAdjacentHTML('afterbegin',h);
}

function animateProcessing(){
  const nodes=document.querySelectorAll('.pstep');
  const bar=$('procBar'), barM=$('procBarM'), pct=$('procPct');
  let i=0;
  const run=()=>{
    if(i>0){nodes.forEach(n=>{if(+n.dataset.i===i-1){n.className='pstep done';n.querySelector('.status').textContent='done';}});}
    if(i<nodes.length){
      nodes.forEach(n=>{if(+n.dataset.i===i){n.className='pstep run';n.querySelector('.status').textContent='working…';}});
      const p=Math.round(((i+1)/nodes.length)*100);
      if(bar)bar.style.width=p+'%'; if(barM)barM.style.width=p+'%';
      if(pct)pct.textContent=p+'% · '+PROC[i].t;
      i++; setTimeout(run,850);
    }
  };

}

function rqRender(){
  const q=RQ[rqState.i%RQ.length];
  return `<div class="row" style="justify-content:space-between;align-items:center">
      <span class="pill cyan tiny">📘 Review</span><span class="pill gold tiny">Q ${rqState.i+1}/5</span></div>

      <div id="rqEx"></div>
    </div>`;
}
function rqPick(k){
  if(rqState.answered)return;
  rqState.answered=true;rqState.picked=k;
  const q=RQ[rqState.i%RQ.length];
  if(k===q.a)rqState.correct++;
  document.querySelectorAll('#rqHost .opt').forEach(o=>{
    const kk=+o.dataset.k;
    if(kk===q.a)o.classList.add('correct');
    if(kk===k&&k!==q.a)o.classList.add('wrong');
    o.style.pointerEvents='none';
  });
  const nextTxt = rqState.i>=4 ? 'Finish review ✅' : 'Next question ▶';
  $('rqEx').innerHTML=`<div class="explain fadeup"><b>${k===q.a?'✅ Correct!':'❌ Not quite.'}</b> ${q.e}</div>
    <button class="btn green sm" style="margin-top:10px;width:100%" onclick="rqNext()">${nextTxt}</button>`;
  typeset($('rqEx'));
}
function rqNext(){
  if(rqState.i>=4){ // finished
    state.reviewDone[0]=true;
    const bonus=rqState.correct>=5?100:0;
    state.xp+=150+bonus; setXP();
    toast('Review complete! +150 XP'+(bonus?' +100 perfect bonus':''));
    go(9); return;
  }
  rqState.i++;rqState.answered=false;rqState.picked=null;
  $('rqHost').innerHTML=rqRender();
  typeset($('rqHost'));
}

      <span class="timer ${asState.time>120?'':'calm'}" id="phoneTimer" style="font-size:14px">⏱ ${fmt(asState.time)}</span></div>
    <div class="qcard">
      <div class="qnum">PICK ANY QUESTION</div>
      <div class="qgrid" id="asBoardM">${asBoard(true)}</div>
    </div>
    <button class="btn red sm" onclick="asStart()" style="width:100%">${asState.started?'Submit test':'▶ Start timer'}</button>
  </div>`;},
  after(){ if(asState.started) asTick(); }
};
function asBoard(mobile){let h='';for(let i=1;i<=10;i++){const a=asState.answered[i];
  h+=`<div class="qtile ${a?'answered':''}" onclick="asAnswer(${i})"><span class="qn">${a?'✓':i}</span>
    <span class="tiny">${a?'done':'Q'+i}</span></div>`;}return h;}
function asStart(){
  if(!asState.started){asState.started=true;asTick();render();toast('⏱ Timer started — it will not pause');}
  else{ // submit
    const correct=Object.keys(asState.answered).length;
    let xp=correct>=10?500:correct>=7?250:correct>=5?50:-120;
    state.xp=Math.max(0,state.xp+xp); setXP();
    clearInterval(asState.timer);
    toast((xp>=0?'+':'')+xp+' XP · '+correct+'/10 correct');
    go(9);
  }
}
function asTick(){
  clearInterval(asState.timer);
  asState.timer=setInterval(()=>{
    if(state.stage!==7){clearInterval(asState.timer);return;}
    asState.time--; if(asState.time<=0){asState.time=0;clearInterval(asState.timer);}
    const t=fmt(asState.time);
    ['deskTimer','phoneTimer'].forEach(id=>{const el=$(id);if(el){el.textContent='⏱ '+t;el.classList.toggle('calm',asState.time>120?false:false);}});
  },1000);
}
function asAnswer(i){
  if(!asState.started){toast('Hit “Start timer” first');return;}
  asState._target=i; go(8); // jump to camera to "answer"
}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}

/* ---- 9. CAMERA ---- */
R.camera = {
  desktop(){return `<div class="pad-lg col center" style="justify-content:center;height:100%">
    <div class="card" style="max-width:440px">
      <div style="font-size:56px">📱</div>
      <h3 class="sec">Answering on mobile</h3>
      <div class="small muted">The student handwrites the solution, photographs it, and crops to the note. Desktop just watches the live status.</div>
      <div class="row" style="margin-top:14px;justify-content:center">
        <div class="dstat"><b>Q${asState._target||3}</b>capturing</div>
        <div class="dstat"><b>3/10</b>answered</div>
        <div class="dstat"><b>⏱ ${fmt(asState.time)}</b>left</div>
      </div>
    </div></div>`;},
  phone(){return `<div class="pad col">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="pill red tiny">⚔️ Q${asState._target||3}</span>
      <span class="timer calm" style="font-size:13px">⏱ ${fmt(asState.time)}</span></div>
    <div class="qcard" style="padding:10px">
      <div class="qnum">SNAP YOUR HANDWRITTEN SOLUTION</div>
      <div class="camera" id="cam" style="margin-top:8px">
        <div class="viewfind">
          <div class="hw" style="top:24px;left:18px;font-size:20px">lim x→2</div>
          <div class="hw" style="top:70px;left:24px;font-size:16px">(x²−4)/(x−2)</div>
          <div class="hw" style="top:110px;left:30px;font-size:16px">= (x+2)</div>
          <div class="hw" style="top:150px;left:40px;font-size:18px;color:#c62828">= 4 ✓</div>
        </div>
        <div class="crop" id="crop" style="left:8%;top:8%;width:70%;height:52%">
          <span class="h tl"></span><span class="h tr"></span><span class="h bl"></span><span class="h br"></span>
        </div>
      </div>
      <div class="tiny muted center" style="margin:8px 0">Drag the gold box to crop just your working</div>
      <div id="camActions">
        <div class="shutter" onclick="camShot()"></div>
      </div>
    </div>
  </div>`;},
  after(){ dragCrop(); }
};
function camShot(){
  const cam=$('cam'); if(cam){cam.style.transition='.15s';cam.style.filter='brightness(2)';setTimeout(()=>cam.style.filter='',150);}
  $('camActions').innerHTML=`<div class="fadeup center">
    <div class="pill green" style="margin:6px auto">✂️ Cropped & recognized</div>
    <div class="small muted tiny" style="margin:6px 0">OCR: “lim x→2 (x²−4)/(x−2)=4” — matches expected ✅</div>
    <div class="row" style="gap:8px">
      <button class="btn ghost sm" style="flex:1" onclick="R.camera.afterRetake()">Retake</button>
      <button class="btn green sm" style="flex:1" onclick="camSubmit()">Submit ▶</button>
    </div></div>`;
}
R.camera.afterRetake=function(){ $('phoneScreen').innerHTML=R.camera.phone(); dragCrop(); };
function camSubmit(){
  const i=asState._target||3; asState.answered[i]=true;
  toast('Answer submitted for Q'+i);
  // go back to assessment board
  go(7);
}
function dragCrop(){
  const crop=$('crop'),cam=$('cam'); if(!crop||!cam)return;
  let drag=false,ox,oy;
  const start=e=>{drag=true;const p=pt(e);ox=p.x-crop.offsetLeft;oy=p.y-crop.offsetTop;e.preventDefault();};
  const move=e=>{if(!drag)return;const p=pt(e);let x=p.x-ox,y=p.y-oy;
    x=Math.max(0,Math.min(x,cam.clientWidth-crop.clientWidth));
    y=Math.max(0,Math.min(y,cam.clientHeight-crop.clientHeight));
    crop.style.left=x+'px';crop.style.top=y+'px';};
  const end=()=>drag=false;
  const pt=e=>{const r=cam.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  crop.addEventListener('mousedown',start);crop.addEventListener('touchstart',start,{passive:false});
  window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',end);window.addEventListener('touchend',end);
}

/* ---- 10. REWARD ---- */
R.reward = {
  desktop(){return `<div class="pad-lg col center burst" style="justify-content:center;height:100%">
    <div class="levelup">⚔️ ASSESSMENT COMPLETE</div>
    <div class="xp-num">+500 XP</div>
    <div class="row" style="justify-content:center">
      <div class="dstat"><b>9/10</b>correct</div>
      <div class="dstat"><b>+100</b>perfect streak</div>
      <div class="dstat"><b>6:12</b>time</div>
    </div>
    <div style="max-width:420px;width:100%;margin-top:6px">
      <div class="row" style="justify-content:space-between"><span class="small">LVL ${state.level}</span><span class="small">LVL ${state.level+1}</span></div>
      <div class="bar xp big"><i id="rewardBar" style="width:${xpPctInLevel()}%"></i></div>
      <div class="tiny muted" style="margin-top:6px">Battlepass tier 4 → tier 5 unlocked 🎨</div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="badge" style="background:#FEC513">🔥</div>
      <div class="badge" style="background:#8a4bff">🏅</div>
      <span class="pill gold" style="align-self:center">New badge: Concept King 👑</span>
    </div>
  </div>`;},
  phone(){return `<div class="pad col center burst" style="justify-content:center">
    <div class="levelup" style="font-size:16px">🎉 NICE WORK!</div>
    <div class="xp-num" style="font-size:40px">+500</div><div class="tiny muted">XP earned</div>
    <div class="reward unlocked" style="width:100px;height:100px;font-size:44px;margin:8px auto">🎨</div>
    <div class="pill gold">Tier 5 unlocked!</div>
    <div style="width:100%;margin-top:8px">
      <div class="bar xp"><i id="rewardBarM" style="width:${xpPctInLevel()}%"></i></div>
      <div class="tiny muted" style="margin-top:4px">${xpToNext()} XP to LVL ${state.level+1}</div>
    </div>
    <button class="btn gold sm" style="margin-top:10px" onclick="go(4)">Back to Battlepass</button>
  </div>`;},
  after(){
    const host=$('desktopScreen'); confetti(host,50);
    confetti($('phoneScreen'),30);
    setTimeout(()=>{const b=$('rewardBar'),bm=$('rewardBarM');
      const nw=Math.min(100,xpPctInLevel()+22);
      if(b)b.style.width=nw+'%'; if(bm)bm.style.width=nw+'%';},400);
  }
};

/* ================= ENGINE ================= */
function typeset(el){
  if(!el||!window.renderMathInElement)return;
  try{renderMathInElement(el,{delimiters:[
    {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
    {left:'\\(',right:'\\)',display:false}],throwOnError:false});}catch(e){}
}
function toast(msg){
  let t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText=`position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:linear-gradient(180deg,#ffd83f,#DD7504);color:#151319;font-family:var(--f-head);
    padding:12px 22px;border:4px solid #151319;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.4);
    z-index:999;font-size:14px;animation:fadeup .25s`;
  document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';},1600);
  setTimeout(()=>t.remove(),2100);
}
function buildStepper(){
  $('stepper').innerHTML=STAGES.map((s,i)=>`<div class="step" data-i="${i}" onclick="go(${i})">
    <span class="num">${i+1}</span>${s.name}</div>`).join('');
}
function primaryDevice(key){
  // which device is the "primary" for this stage
  if(['graph','course','library'].includes(key))return 'desktop';
  if(['review','assessment','camera'].includes(key))return 'phone';
  return 'both';
}
function render(){
  const st=STAGES[state.stage], r=R[st.key];
  $('stageTitle').innerHTML=`<h2>${st.title}</h2><p>${st.desc}</p>`;
  $('desktopScreen').innerHTML=r.desktop();
  $('phoneScreen').innerHTML=r.phone();
  typeset($('desktopScreen')); typeset($('phoneScreen'));
  // labels
  const pd=primaryDevice(st.key);
  $('deskLabel').className='device-label'+(pd==='desktop'?' primary':'');
  $('phoneLabel').className='device-label'+(pd==='phone'?' primary':'');
  $('deskLabel').innerHTML='🖥️ Desktop'+(pd==='desktop'?' · primary':pd==='phone'?' · mirror':'');
  $('phoneLabel').innerHTML='📱 Mobile'+(pd==='phone'?' · primary':pd==='desktop'?' · view-only':'');
  // stepper state
  document.querySelectorAll('.step').forEach(s=>{const i=+s.dataset.i;
    s.className='step'+(i===state.stage?' active':(i<state.stage?' done':''));});
  $('prevBtn').disabled=state.stage===0;
  $('nextBtn').disabled=state.stage===STAGES.length-1;
  setXP();
  if(r.after)r.after();
  document.querySelector('.frames').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function go(i){state.stage=Math.max(0,Math.min(STAGES.length-1,i));render();}
$('prevBtn').onclick=()=>go(state.stage-1);
$('nextBtn').onclick=()=>go(state.stage+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(state.stage+1);if(e.key==='ArrowLeft')go(state.stage-1);});

buildStepper();
render();
// KaTeX loads deferred; re-typeset current screens once it's ready
window.addEventListener('load',()=>{typeset($('desktopScreen'));typeset($('phoneScreen'));});
</script>
</body>
</html>
